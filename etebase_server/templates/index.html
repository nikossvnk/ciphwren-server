<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Etebase server</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --muted: #5f5f5a; --card: #fff; --line: #e2e2dd; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #161615; --fg: #ececea; --muted: #a3a39d; --card: #1f1f1d; --line: #33332f; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
             font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { box-sizing: border-box; max-width: 30rem; margin: 1rem; padding: 2rem; background: var(--card);
             border: 1px solid var(--line); border-radius: 12px; }
      h1 { margin: 0 0 .75rem; font-size: 1.35rem; }
      p { margin: .5rem 0 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Etebase server</h1>
      <p>This is a private, end-to-end encrypted sync server. There is nothing to see in a browser.</p>
      <p>To use it, enter this address as the server URL in an app that supports Etebase (EteSync 2.0).</p>
    </main>
  </body>
</html>
